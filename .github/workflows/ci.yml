name: SuperIntelligence CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-posix:
    name: POSIX (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang++
            bm: CLANG
          - os: ubuntu-latest
            compiler: g++
            bm: GCC
          - os: macos-latest
            compiler: clang++
            bm: CLANG_macOS

    steps:
      - name: Checkout SuperIntelligence
        uses: actions/checkout@v4
        with:
          path: SuperIntelligence

      - name: Checkout UppBootstrap
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBootstrap
          path: UppBootstrap

      - name: Checkout UppBuilder
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBuilder
          path: UppBuilder

      - name: Checkout BazaarCore
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/BazaarCore
          path: BazaarCore

      - name: Checkout VFS
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/VFS
          path: VFS

      - name: Checkout Upstream U++ (ultimatepp)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: ultimatepp

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang g++ libbz2-dev libexpat1-dev libfontconfig1-dev libfreetype-dev liblz4-dev liblzma-dev libpcre2-dev libpng-dev libjpeg-dev libssl-dev libx11-dev libxcb1-dev libxxhash-dev libzstd-dev zlib1g-dev libgtk-3-dev libnotify-dev xvfb

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 libpng lz4 pcre2 xxhash zstd xz bzip2
          echo "CPATH=/opt/homebrew/include:/opt/homebrew/opt/openssl@3/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/opt/homebrew/lib:/opt/homebrew/opt/openssl@3/lib" >> "$GITHUB_ENV"

      - name: Bootstrap umk with UppBootstrap
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cd UppBootstrap
          chmod +x ./bootstrap.sh
          ./bootstrap.sh --upp-root "$GITHUB_WORKSPACE/ultimatepp" --verbose
          echo "$GITHUB_WORKSPACE/ultimatepp/bin" >> "$GITHUB_PATH"

      - name: Bootstrap UppBuilder
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cd UppBuilder
          chmod +x ./bootstrap.sh
          ./bootstrap.sh
          echo "$GITHUB_WORKSPACE/UppBuilder" >> "$GITHUB_PATH"

      - name: Verify umk and UppBuilder
        run: |
          umk
          uppbuilder --version
          uppbuilder --help

      - name: Materialize Patched BazaarCore Assembly
        run: |
          cd BazaarCore
          uppbuilder --apply-patches --upstream "$GITHUB_WORKSPACE/ultimatepp/uppsrc" --applied-patches "$GITHUB_WORKSPACE/BazaarCore/patched-uppsrc" -v

      - name: Build SweAgentDemo (${{ matrix.bm }})
        run: |
          cd SuperIntelligence
          uppbuilder examples/SweAgentDemo -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v

      - name: Verify SweAgentDemo Binary
        run: |
          test -f SuperIntelligence/bin/SweAgentDemo
          ls -lh SuperIntelligence/bin/SweAgentDemo
          file SuperIntelligence/bin/SweAgentDemo

      - name: Run Self-Contained SweAgent Tests
        run: |
          SuperIntelligence/bin/SweAgentDemo test 15
          SuperIntelligence/bin/SweAgentDemo test 16
          SuperIntelligence/bin/SweAgentDemo test 17

      - name: Build McpCheck (${{ matrix.bm }})
        run: |
          cd SuperIntelligence
          uppbuilder tests/McpCheck -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v

      - name: Run McpCheck Test Suite
        run: |
          SuperIntelligence/bin/McpCheck

      - name: Build CorpusScore (${{ matrix.bm }})
        run: |
          cd SuperIntelligence
          uppbuilder Analysis/CorpusScore -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v

      - name: Build & Run CorpusScoreCheck (${{ matrix.bm }})
        run: |
          cd SuperIntelligence
          uppbuilder tests/CorpusScoreCheck -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v
          SuperIntelligence/bin/CorpusScoreCheck

      - name: Build Playground (${{ matrix.bm }})
        run: |
          cd SuperIntelligence
          uppbuilder examples/Playground -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" --vfs "$GITHUB_WORKSPACE/VFS" -v

      - name: Run Playground Automated Self-Test (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          cd SuperIntelligence
          xvfb-run -a ./bin/Playground --test

      - name: Run Playground Automated Self-Test (macOS)
        if: runner.os == 'macOS'
        run: |
          cd SuperIntelligence
          ./bin/Playground --test

  build-windows:
    name: Windows (windows-latest - MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout SuperIntelligence
        uses: actions/checkout@v4
        with:
          path: SuperIntelligence

      - name: Checkout UppBootstrap
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBootstrap
          path: UppBootstrap

      - name: Checkout UppBuilder
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBuilder
          path: UppBuilder

      - name: Checkout BazaarCore
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/BazaarCore
          path: BazaarCore

      - name: Checkout VFS
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/VFS
          path: VFS

      - name: Checkout Upstream U++ (ultimatepp)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: ultimatepp

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Dependencies via vcpkg (Windows)
        shell: cmd
        env:
          VCPKG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vcpkg install openssl:x64-windows zlib:x64-windows bzip2:x64-windows liblzma:x64-windows lz4:x64-windows zstd:x64-windows xxhash:x64-windows pcre2:x64-windows libpng:x64-windows libjpeg-turbo:x64-windows
          vcpkg integrate install
          copy /y "C:\vcpkg\installed\x64-windows\lib\z.lib" "C:\vcpkg\installed\x64-windows\lib\zs.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" "C:\vcpkg\installed\x64-windows\debug\lib\zs.lib"
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" "C:\vcpkg\installed\x64-windows\debug\lib\z.lib"
          )
          copy /y "C:\vcpkg\installed\x64-windows\lib\pcre2-8.lib" "C:\vcpkg\installed\x64-windows\lib\pcre2.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\pcre2-8d.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\pcre2-8d.lib" "C:\vcpkg\installed\x64-windows\debug\lib\pcre2.lib"
          )
          copy /y "C:\vcpkg\installed\x64-windows\lib\libpng16.lib" "C:\vcpkg\installed\x64-windows\lib\png.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\libpng16d.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\libpng16d.lib" "C:\vcpkg\installed\x64-windows\debug\lib\png.lib"
          )
          echo INCLUDE=C:\vcpkg\installed\x64-windows\include;%INCLUDE%>>%GITHUB_ENV%
          echo LIB=C:\vcpkg\installed\x64-windows\lib;C:\vcpkg\installed\x64-windows\debug\lib;%LIB%>>%GITHUB_ENV%
          echo C:\vcpkg\installed\x64-windows\bin>>%GITHUB_PATH%

      - name: Bootstrap umk with UppBootstrap
        shell: cmd
        run: |
          cd UppBootstrap
          call bootstrap.cmd --upp-root "%GITHUB_WORKSPACE%\ultimatepp" --verbose
          echo %GITHUB_WORKSPACE%\ultimatepp\bin>>%GITHUB_PATH%

      - name: Bootstrap UppBuilder
        shell: cmd
        run: |
          cd UppBuilder
          call bootstrap.bat
          echo %GITHUB_WORKSPACE%\UppBuilder>> %GITHUB_PATH%

      - name: Verify umk and UppBuilder
        shell: cmd
        run: |
          umk.exe
          uppbuilder.exe --version
          uppbuilder.exe --help

      - name: Materialize Patched BazaarCore Assembly
        shell: cmd
        run: |
          cd BazaarCore
          uppbuilder.exe --apply-patches --upstream "%GITHUB_WORKSPACE%\ultimatepp\uppsrc" --applied-patches "%GITHUB_WORKSPACE%\BazaarCore\patched-uppsrc" -v

      - name: Build SweAgentDemo (MSVC)
        shell: cmd
        run: |
          cd SuperIntelligence
          uppbuilder.exe examples/SweAgentDemo -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v

      - name: Verify SweAgentDemo Binary
        shell: cmd
        run: |
          if not exist "SuperIntelligence\bin\SweAgentDemo.exe" exit /b 1
          dir "SuperIntelligence\bin\SweAgentDemo.exe"

      - name: Run Self-Contained SweAgent Tests (Windows)
        shell: cmd
        run: |
          if exist "C:\vcpkg\installed\x64-windows\bin" copy /y "C:\vcpkg\installed\x64-windows\bin\*.dll" SuperIntelligence\bin\
          SuperIntelligence\bin\SweAgentDemo.exe test 15
          SuperIntelligence\bin\SweAgentDemo.exe test 16
          SuperIntelligence\bin\SweAgentDemo.exe test 17

      - name: Build McpCheck (MSVC)
        shell: cmd
        run: |
          cd SuperIntelligence
          uppbuilder.exe tests/McpCheck -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v

      - name: Run McpCheck Test Suite (Windows)
        shell: cmd
        run: |
          if exist "C:\vcpkg\installed\x64-windows\bin" copy /y "C:\vcpkg\installed\x64-windows\bin\*.dll" SuperIntelligence\bin\
          SuperIntelligence\bin\McpCheck.exe

      - name: Build CorpusScore (MSVC)
        shell: cmd
        run: |
          cd SuperIntelligence
          uppbuilder.exe Analysis/CorpusScore -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v

      - name: Build & Run CorpusScoreCheck (MSVC)
        shell: cmd
        run: |
          cd SuperIntelligence
          uppbuilder.exe tests/CorpusScoreCheck -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v
          if exist "C:\vcpkg\installed\x64-windows\bin" copy /y "C:\vcpkg\installed\x64-windows\bin\*.dll" SuperIntelligence\bin\
          SuperIntelligence\bin\CorpusScoreCheck.exe

      - name: Build Playground (MSVC)
        shell: cmd
        run: |
          cd SuperIntelligence
          uppbuilder.exe examples/Playground -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" --vfs "%GITHUB_WORKSPACE%\VFS" -v

      - name: Run Playground Self-Test (Windows)
        shell: cmd
        run: |
          if exist "C:\vcpkg\installed\x64-windows\bin" copy /y "C:\vcpkg\installed\x64-windows\bin\*.dll" SuperIntelligence\bin\
          SuperIntelligence\bin\Playground.exe --test
